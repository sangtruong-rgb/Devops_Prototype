name: App CI

# Run automatically for pushes and pull requests, or manually from GitHub.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # This app has no external dependencies, so no install step is needed.
      - name: Run HTTP tests
        run: npm test

  build:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/sangtruong-rgb/devops-app

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build -f dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push "$IMAGE:$GITHUB_SHA"
name: App CI

# Run automatically for pushes and pull requests, or manually from GitHub.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install development dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

  test:
    name: Test API
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install development dependencies
        run: npm ci

      - name: Run HTTP tests
        run: npm test

  build:
    name: Build, scan, and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/sangtruong-rgb/devops-app

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Load each platform locally so Trivy scans the exact images we will push.
      - name: Build AMD64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build ARM64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Scan AMD64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: 'v0.75.0'
          scan-type: 'image'
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}-amd64
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'json'
          output: ${{ runner.temp }}/trivy-amd64.json

      - name: Scan ARM64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          skip-setup-trivy: true
          scan-type: 'image'
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}-arm64
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'json'
          output: ${{ runner.temp }}/trivy-arm64.json

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports-${{ github.sha }}
          path: ${{ runner.temp }}/trivy-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned images and multi-platform index
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}-amd64"
          docker push "${IMAGE}:${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"

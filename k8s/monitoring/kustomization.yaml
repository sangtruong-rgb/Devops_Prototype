apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: the discovery Role belongs in devops-app.
resources:
  - namespace.yaml
  - rbac.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml=prometheus/prometheus.yml
      - alerts.yml=prometheus/alerts.yml
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml=grafana/datasources.yaml
  - name: grafana-providers
    namespace: monitoring
    files:
      - dashboards.yaml=grafana/dashboards.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - devops-app.json=grafana/devops-app.json
